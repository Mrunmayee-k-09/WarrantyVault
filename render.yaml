
services:
  - type: web
    name: warrantyvault-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: APP_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: FLASK_DEBUG
        value: "0"

      - key: SESSION_COOKIE_SECURE
        value: "true"

      - key: REMEMBER_COOKIE_SECURE
        value: "true"

      - key: CLAIM_SUBMISSION_MODE
        value: simulation

      - key: CLAIM_SIMULATION_ALLOWED
        value: "true"

      - key: TESSERACT_CMD
        value: /usr/bin/tesseract

      - key: TIMEZONE
        value: Asia/Kolkata
